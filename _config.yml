# Site settings
locale                   : "en-US"
title                    : "Alireza Farshin"
name                     : &name "Alireza Farshin"
description              : &description "Distributed Systems Researcher at NVIDIA, working on networked systems"
url                      : https://aliireza.github.io
baseurl                  : ""
repository               : "aliireza/aliireza.github.io"

# Author
author:
  name             : "Alireza Farshin"
  avatar           : "aliireza.jpg"
  bio              : "Distributed Systems Researcher @ NVIDIA"
  location         : "Stockholm, Sweden"
  googlescholar    : "https://scholar.google.com/citations?user=cfCpKWwAAAAJ&hl=en"
  github           : "aliireza"
  linkedin         : "alireza-farshin"
  orcid            : "https://orcid.org/0000-0001-5083-4052"
  soundcloud       : "alireza-farshin/tracks"
  twitter          : "alirezafarshin"

# Reading files
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - tools
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults — the homepage is rendered entirely by _layouts/modern.html
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: none

# Outputting
permalink: /:categories/:title/
timezone: Europe/Stockholm

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
